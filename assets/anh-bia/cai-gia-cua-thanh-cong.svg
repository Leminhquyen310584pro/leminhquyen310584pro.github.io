<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Cận cảnh một người gục đầu xuống hai cánh tay trên bàn làm việc giữa đêm, bên cạnh là đèn bàn và đồng hồ chỉ gần 3 giờ sáng">
  <defs>
    <linearGradient id="tuong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EBDD"/>
      <stop offset="1" stop-color="#EAD3B5"/>
    </linearGradient>
    <radialGradient id="anhden" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3D6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F4D9A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tường ban đêm -->
  <rect width="1200" height="675" fill="url(#tuong)"/>

  <!-- Đồng hồ: gần 3 giờ sáng -->
  <circle cx="1110" cy="120" r="46" fill="#FFFFFF" stroke="#5C3D28" stroke-width="6"/>
  <line x1="1110" y1="120" x2="1129" y2="109" stroke="#5C3D28" stroke-width="5" stroke-linecap="round"/>
  <line x1="1110" y1="120" x2="1081" y2="137" stroke="#2E2018" stroke-width="4" stroke-linecap="round"/>

  <!-- Cửa sổ tối, mờ -->
  <rect x="60" y="80" width="200" height="170" fill="#C9D6E0" stroke="#8A5A3B" stroke-width="8"/>
  <circle cx="200" cy="130" r="22" fill="#FFE8B0" opacity="0.9"/>

  <!-- Ánh đèn bàn -->
  <circle cx="1010" cy="330" r="190" fill="url(#anhden)"/>
  <rect x="1002" y="360" width="16" height="110" fill="#5C3D28"/>
  <polygon points="966,344 1054,344 1036,298 984,298" fill="#C9A27A"/>

  <!-- Vai và lưng người, co lại -->
  <path d="M300 480 Q310 320 600 312 Q890 320 900 480 Z" fill="#5C3D28"/>

  <!-- Đầu gục xuống, nhìn từ phía sau -->
  <circle cx="600" cy="380" r="78" fill="#E0B48A"/>
  <path d="M522 380 Q524 296 600 296 Q676 296 678 380 Q650 330 600 332 Q550 330 522 380 Z" fill="#3A2418"/>

  <!-- Hai cánh tay khoanh lại, đặt trên bàn -->
  <rect x="380" y="426" width="440" height="60" rx="30" fill="#8A5A3B"/>
  <rect x="540" y="420" width="120" height="70" rx="12" fill="#6E4630"/>
  <rect x="372" y="426" width="46" height="60" rx="8" fill="#F4EBDD"/>
  <rect x="782" y="426" width="46" height="60" rx="8" fill="#F4EBDD"/>

  <!-- Mặt bàn -->
  <rect x="0" y="484" width="1200" height="22" fill="#8A5A3B"/>
  <rect x="0" y="506" width="1200" height="169" fill="#8A5A3B"/>

  <!-- Đồ trên bàn, mờ -->
  <rect x="120" y="440" width="110" height="44" fill="#E8D6BC" opacity="0.35"/>
  <rect x="860" y="438" width="54" height="46" rx="6" fill="#B5652E" opacity="0.5"/>
  <rect x="940" y="446" width="70" height="38" fill="#F4EBDD" opacity="0.3"/>
</svg>
